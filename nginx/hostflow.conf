# HostFlow — Nginx Main Config
# Place in: /etc/nginx/sites-available/hostflow
# Enable: ln -s /etc/nginx/sites-available/hostflow /etc/nginx/sites-enabled/

upstream hostflow_backend {
    server 127.0.0.1:5000 fail_timeout=0;
}

# ── Platform dashboard (app.hostflow.dev) ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hostflow.dev www.hostflow.dev;

    # Redirect HTTP → HTTPS in production
    # return 301 https://$host$request_uri;

    client_max_body_size 512M;

    # Static files served directly by Nginx
    location /static/ {
        alias /var/www/hostflow/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SocketIO — must use upgrade
    location /socket.io/ {
        proxy_pass http://hostflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Main app
    location / {
        proxy_pass http://hostflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 10;
    }
}

# ── Customer sites (*.hostflow.dev) ───────────────────────────────────────────
# Each customer site is served from /var/www/hostflow/user_sites/<user_id>/<subdomain>/
# Nginx serves PHP via PHP-FPM and static files directly.

# Template — duplicated per site by the platform or use a wildcard + map
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<subdomain>[a-z0-9-]+)\.hostflow\.dev$;

    # Site root — set dynamically via Nginx variables
    # For production, generate individual server blocks per site
    set $site_root /var/www/hostflow/user_sites;

    root $site_root/$subdomain;
    index index.php index.html index.htm;

    # Block hidden files
    location ~ /\. {
        deny all;
    }

    # Custom error pages
    error_page 404 /hostflow-404.html;
    error_page 403 /hostflow-403.html;
    error_page 500 /hostflow-500.html;

    location = /hostflow-404.html {
        internal;
        return 302 http://hostflow.dev/errors/site-404?host=$host;
    }
    location = /hostflow-403.html {
        internal;
        return 302 http://hostflow.dev/errors/site-403?host=$host;
    }
    location = /hostflow-500.html {
        internal;
        return 302 http://hostflow.dev/errors/site-500?host=$host;
    }

    # PHP via FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Security
        fastcgi_param PHP_VALUE "
            upload_max_filesize=64M
            post_max_size=64M
            max_execution_time=30
            disable_functions=exec,passthru,shell_exec,system,proc_open,popen
        ";
    }

    # Try files — PHP fallback for clean URLs
    location / {
        try_files $uri $uri/ $uri.php $uri.html =404;
    }

    # Static asset caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Block PHP execution in uploads
    location ~* /uploads/.*\.php$ {
        deny all;
    }
}
