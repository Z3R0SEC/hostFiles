{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center p-6" style="background:#0d0d0f">
  <div class="text-center max-w-sm animate-fade-in">
    <p class="text-8xl font-black leading-none mb-5 select-none" style="color:rgba(255,255,255,0.03)">404</p>
    <div class="w-12 h-12 rounded-xl bg-brand-600/8 border border-brand-600/15 flex items-center justify-center mx-auto mb-4">
      <i class="fas fa-compass text-brand-400 text-base"></i>
    </div>
    <h1 class="text-lg font-bold text-white mb-1.5">Page not found</h1>
    <p class="text-zinc-500 text-sm mb-6">The page you're looking for doesn't exist or has been moved.</p>
    <div class="flex gap-2.5 justify-center">
      <a href="javascript:history.back()" class="btn btn-secondary"><i class="fas fa-arrow-left text-xs"></i> Go back</a>
      <a href="{{ url_for('public.home') }}" class="btn btn-primary"><i class="fas fa-house text-xs"></i> Home</a>
    </div>
  </div>
</div>
{% endblock %}
