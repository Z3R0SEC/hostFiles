{% extends "base.html" %}
{% block title %}Maintenance — {{ platform_name }}{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center p-6" style="background:#0d0d14">
  <div class="text-center max-w-md animate-fade-in">
    <div class="w-20 h-20 rounded-3xl bg-brand-500/10 flex items-center justify-center mx-auto mb-6">
      <i class="fas fa-wrench text-brand-400 text-3xl"></i>
    </div>
    <h1 class="text-3xl font-bold text-white mb-3">Under Maintenance</h1>
    <p class="text-zinc-400 mb-2">{{ platform_name }} is undergoing scheduled maintenance.</p>
    <p class="text-zinc-500 text-sm">We'll be back shortly. Thank you for your patience.</p>
    <div class="mt-8 flex items-center justify-center gap-2 text-zinc-600 text-sm">
      <div class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse-slow"></div>
      <span>Maintenance in progress</span>
    </div>
  </div>
</div>
{% endblock %}
