{{% extends "base.html" %}}
{{% block title %}}{title} — {{{{ platform_name }}}}{{% endblock %}}
{{% block body %}}
<div class="min-h-screen" style="background:#0d0d14">
  <nav class="flex items-center justify-between px-6 py-4 border-b border-white/[0.06]">
    <a href="{{{{ url_for('public.home') }}}}" class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-brand-500 flex items-center justify-center">
        <i class="fas fa-server text-white text-sm"></i>
      </div>
      <span class="font-bold text-white">{{{{ platform_name }}}}</span>
    </a>
    <a href="{{{{ url_for('auth.login') }}}}" class="btn btn-secondary text-sm">Sign In</a>
  </nav>
  <div class="max-w-3xl mx-auto px-6 py-16">
    <h1 class="text-4xl font-bold text-white mb-8">{title}</h1>
    <div class="text-zinc-400 leading-relaxed space-y-4">
      <p>This page contains information about {title.lower()}. Content coming soon.</p>
    </div>
  </div>
</div>
{{% endblock %}}
